# The Collector is a pipeline:  RECEIVE -> PROCESS -> EXPORT
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch: {}                      # group data into batches (efficiency)
  memory_limiter:                # protect the collector from OOM
    check_interval: 1s
    limit_mib: 256
  attributes/add_team:           # example of enriching data centrally
    actions:
      - key: team
        value: platform
        action: insert

exporters:
  otlp/jaeger:                   # traces -> Jaeger (it speaks OTLP natively)
    endpoint: jaeger:4317
    tls:
      insecure: true
  prometheus:                    # metrics -> exposed for Prometheus to scrape
    endpoint: 0.0.0.0:8889
  debug:                         # also print to collector's stdout
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/add_team, batch]
      exporters: [otlp/jaeger, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
